<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONYXPURE — JKT48 3D Arena</title>

    <!-- Google Web Fonts: Cinzel (Calligraphy/Luxury) & Outfit (Modern UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Three.js r170 CDN Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- =======================================================================
         1. LOADING SCREEN DENGAN KALIGRAFI ARTISTIK "ONYXPURE"
         ======================================================================= -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-embers"></div>

        <div class="loading-content">
            <!-- Modern Shodo/Brush Calligraphy SVG "ONYXPURE" -->
            <div class="calligraphy-box">
                <svg class="svg-calligraphy" viewBox="0 0 680 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Gradient Definition for Luxury Gold & Cyan Glow -->
                    <defs>
                        <linearGradient id="calligraphyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f59e0b" />
                            <stop offset="45%" stop-color="#38bdf8" />
                            <stop offset="80%" stop-color="#ec4899" />
                            <stop offset="100%" stop-color="#fbbf24" />
                        </linearGradient>
                    </defs>

                    <!-- Artistic Brush Strokes for "ONYXPURE" -->
                    <!-- O -->
                    <path class="calligraphy-stroke" d="M 50 80 C 50 35, 95 25, 115 50 C 135 75, 125 125, 95 130 C 65 135, 50 115, 50 80 Z" 
                          stroke="url(#calligraphyGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- N -->
                    <path class="calligraphy-stroke" d="M 150 128 L 150 34 L 205 128 L 205 34" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- Y -->
                    <path class="calligraphy-stroke" d="M 235 34 L 260 84 L 285 34 M 260 84 L 260 130" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- X -->
                    <path class="calligraphy-stroke" d="M 315 36 L 365 128 M 365 36 L 315 128" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- P -->
                    <path class="calligraphy-stroke" d="M 400 130 L 400 34 L 435 34 C 460 34, 460 80, 435 80 L 400 80" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- U -->
                    <path class="calligraphy-stroke" d="M 485 34 L 485 100 C 485 128, 530 128, 530 100 L 530 34" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- R -->
                    <path class="calligraphy-stroke" d="M 560 130 L 560 34 L 595 34 C 615 34, 615 76, 595 76 L 560 76 M 588 76 L 618 130" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- E -->
                    <path class="calligraphy-stroke" d="M 645 34 L 645 130 M 645 34 L 675 34 M 645 82 L 670 82 M 645 130 L 675 130" 
                          stroke="url(#calligraphyGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>

            <div class="loading-subtitle">3D HERO ARENA ENGINE</div>

            <!-- Animated Progress Bar -->
            <div class="loading-bar-track">
                <div id="loading-bar-fill" class="loading-bar-fill"></div>
            </div>

            <!-- Dynamic Status Log -->
            <div id="loading-status-text" class="loading-status-text">
                Initializing WebGL & Three.js PBR Pipeline...
            </div>
        </div>
    </div>

    <!-- =======================================================================
         2. LOBBY / LAYAR PEMILIHAN HERO 3D (Injected by js/heroSelect.js)
         ======================================================================= -->
    <div id="lobby-container" style="display: none;"></div>

    <!-- =======================================================================
         3. ENGINE GAMEPLAY ARENA 3D (Injected by js/arenaEngine.js)
         ======================================================================= -->
    <div id="arena-container" style="display: none;"></div>

    <!-- Main JavaScript Bootstrap -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
