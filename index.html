<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONYXPURE — JKT48 3D Arena</title>

    <!-- Google Web Fonts: Cinzel (Luxury Hero Title) & Outfit (Modern Esports UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Three.js r170 CDN Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- =======================================================================
         1. LUXURY LOADING SCREEN WITH MAJESTIC "ONYXPURE" CREST & LOGOTYPE
         ======================================================================= -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-embers"></div>
        <div class="loading-aurora"></div>

        <div class="loading-content">
            <!-- Majestic 3D Hexagonal Hero Crest -->
            <div class="brand-crest-wrapper">
                <svg class="brand-crest-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="crestGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fde68a" />
                            <stop offset="50%" stop-color="#f59e0b" />
                            <stop offset="100%" stop-color="#b45309" />
                        </linearGradient>
                        <linearGradient id="crestCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e0f2fe" />
                            <stop offset="50%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#0284c7" />
                        </linearGradient>
                        <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- Outer Hexagonal Rune Ring -->
                    <polygon points="80,12 138,45 138,115 80,148 22,115 22,45" 
                             stroke="url(#crestCyanGrad)" stroke-width="2.5" fill="none" opacity="0.65" class="crest-outer-spin" />

                    <!-- Inner Beveled Golden Crest -->
                    <polygon points="80,24 126,51 126,109 80,136 34,109 34,51" 
                             stroke="url(#crestGoldGrad)" stroke-width="3" fill="rgba(15, 23, 42, 0.75)" filter="url(#crestGlow)" />

                    <!-- Celestial Angel Wings & Center Sword/Diamond -->
                    <!-- Left Wing -->
                    <path d="M 40 80 Q 55 50 80 40 Q 60 70 50 95 Z" fill="url(#crestCyanGrad)" opacity="0.85" />
                    <!-- Right Wing -->
                    <path d="M 120 80 Q 105 50 80 40 Q 100 70 110 95 Z" fill="url(#crestCyanGrad)" opacity="0.85" />

                    <!-- Center Astral Diamond Gem -->
                    <polygon points="80,52 94,80 80,108 66,80" fill="url(#crestGoldGrad)" filter="url(#crestGlow)" />
                    <!-- Diamond Core Highlight -->
                    <circle cx="80" cy="80" r="4" fill="#ffffff" />
                </svg>
            </div>

            <!-- Majestic Luxury Logotype "ONYXPURE" -->
            <div class="brand-title-group">
                <h1 class="brand-logotype">
                    <span class="letter-onyx">ONYX</span><span class="letter-pure">PURE</span>
                </h1>
                <div class="brand-shimmer-bar"></div>
            </div>

            <!-- Grand Ornamental Subtitle -->
            <div class="loading-ornament-row">
                <span class="ornament-line"></span>
                <span class="ornament-text">✦ JKT48 3D HERO ARENA ✦</span>
                <span class="ornament-line"></span>
            </div>

            <!-- Sleek Modern Progress Bar -->
            <div class="loading-bar-track">
                <div id="loading-bar-fill" class="loading-bar-fill"></div>
            </div>

            <!-- Dynamic Real-Time Status -->
            <div id="loading-status-text" class="loading-status-text">
                Initializing WebGL & Three.js PBR Pipeline...
            </div>

            <!-- Instant Access Button (Always Ready) -->
            <button id="btn-skip-loading" class="btn-skip-loading">
                <span>MASUK LOBI SEKARANG</span>
                <span class="btn-arrow">➔</span>
            </button>
        </div>
    </div>

    <!-- =======================================================================
         2. LOBBY / LAYAR PEMILIHAN HERO 3D (Injected by js/heroSelect.js)
         ======================================================================= -->
    <div id="lobby-container" style="display: none;"></div>

    <!-- =======================================================================
         3. ENGINE GAMEPLAY ARENA 3D (Injected by js/arenaEngine.js)
         ======================================================================= -->
    <div id="arena-container" style="display: none;"></div>

    <!-- Main JavaScript Bootstrap -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
